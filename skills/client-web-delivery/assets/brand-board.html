<!doctype html>
<!--
  Brand board, one image (brand-discovery -> references/brand-kit.md). Copy to deliverables/brand/src/board.html and replace every {{...}}.
  It shows only real things: the mark, the colors with their codes, the type, two of the client's own photos, one mockup, one line.
  A proposed mark or color is labeled PROPOSED in its caption until the owner approves it.
  Each swatch sets its own text color so the code reads on it (4.5:1): pick "on-dark" or "on-light".
  Render: python scripts/render_cards.py deliverables/brand deliverables/brand/src/board.html
-->
<html lang="en"><head><meta charset="utf-8">
<title>{{CLIENT}} brand board</title>
<style>
@font-face{font-family:Brand;src:url({{FONT_FILE}}) format("truetype");font-weight:200 800}
:root{--paper:#f3f2ef;--ink:#121212;--muted:#4c4c4c;--mark-bg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Brand,system-ui,sans-serif;color:var(--ink)}
.card{width:100vw;height:100vh;background:var(--paper);padding:4.6vw;display:grid;gap:1.9vw;grid-template-columns:repeat(6,1fr);grid-template-rows:31vw 13vw 24vw 1fr}
.cap{font-size:1.5vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* The mark gets the widest, quietest cell: it is what the board is for. */
.mark{grid-column:1/5;background:var(--mark-bg);border-radius:1.4vw;display:flex;flex-direction:column;justify-content:space-between;padding:2.6vw;overflow:hidden}
.mark img{max-width:86%;max-height:17vw;object-fit:contain;align-self:center}
.mark .word{font-size:7vw;font-weight:800;letter-spacing:-.02em;align-self:center}
.shot{border-radius:1.4vw;overflow:hidden;position:relative;background:#000}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.a{grid-column:5/7}
.sw{border-radius:1.4vw;padding:1.6vw;display:flex;flex-direction:column;justify-content:flex-end;font-size:1.9vw;font-weight:700;line-height:1.25}
.sw small{display:block;font-size:1.5vw;font-weight:500;opacity:.9}
.on-dark{color:#fff}.on-light{color:#121212;border:1px solid rgba(0,0,0,.12)}
.c1{grid-column:1/3}.c2{grid-column:3/5}.c3{grid-column:5/6}.c4{grid-column:6/7}
.type{grid-column:1/4;background:var(--ink);color:#fff;border-radius:1.4vw;padding:2.6vw;display:flex;flex-direction:column;justify-content:space-between}
.type .cap{color:#fff;opacity:.8}
.type b{font-size:11vw;line-height:.9;font-weight:800;letter-spacing:-.04em}
.type p{font-size:2vw;line-height:1.35}
.b{grid-column:4/7}
.line{grid-column:1/4;display:flex;flex-direction:column;justify-content:flex-end;gap:1.2vw}
.line h1{font-size:5.4vw;line-height:1.04;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.c{grid-column:4/7}
</style></head>
<body><div class="card">
  <div class="mark"><span class="cap">{{CLIENT}} · {{LOGO: found / PROPOSED}}</span><img src="logo.png" alt="{{CLIENT}}"></div>
  <div class="shot a"><img src="photo-1.jpg" alt=""></div>

  <div class="sw c1 on-dark" style="background:{{HEX 1}}">{{COLOR NAME}}<small>{{HEX 1}}</small></div>
  <div class="sw c2 on-dark" style="background:{{HEX 2}}">{{COLOR NAME}}<small>{{HEX 2}}</small></div>
  <div class="sw c3 on-light" style="background:{{HEX 3}}">{{COLOR NAME}}<small>{{HEX 3}}</small></div>
  <div class="sw c4 on-light" style="background:{{HEX 4}}">{{COLOR NAME}}<small>{{HEX 4}}</small></div>

  <div class="type"><span class="cap">Type</span><b>Aa</b><p>{{FAMILY, weights}}<br>{{Where it is used}}</p></div>
  <div class="shot b"><img src="mockup.png" alt=""></div>

  <div class="line"><span class="cap">How it sounds</span><h1>{{ONE LINE the owner picked, or from the language bank}}</h1></div>
  <div class="shot c"><img src="photo-2.jpg" alt=""></div>
</div></body></html>
