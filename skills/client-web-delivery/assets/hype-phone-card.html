<!doctype html>
<!--
  Hype set: PHONE CARD (references/hype-set.md). One feature of the site per card.
  Copy to deliverables/hype/src/phone-1.html and replace every {{...}}.
  phone.png: a real phone screenshot of the live pitch showing this feature (scripts/shots.py --phone).
  Colors: the client's brand. --on-brand must read on --brand at 4.5:1 or better.
  Render: python scripts/render_cards.py deliverables/hype deliverables/hype/src/phone-1.html
-->
<html lang="en"><head><meta charset="utf-8">
<title>{{CLIENT}} on a phone</title>
<style>
@font-face{font-family:Brand;src:url({{FONT_FILE}}) format("truetype");font-weight:200 800}
:root{--brand:#1e4872;--on-brand:#ffffff;--accent:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Brand,system-ui,sans-serif}
.card{position:relative;width:100vw;height:100vh;background:var(--brand);color:var(--on-brand);display:grid;grid-template-columns:1fr 41vw;gap:4.6vw;padding:7.4vw 7.4vw 0;overflow:hidden}
.words{display:flex;flex-direction:column;padding-bottom:7.4vw}
.name{font-size:2.6vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.step{margin-top:auto;font-size:2.6vw;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:7.6vw;line-height:1.05;font-weight:800;letter-spacing:-.028em;margin-top:2vw;text-wrap:balance}
.sub{font-size:3.7vw;line-height:1.34;margin-top:2.8vw;opacity:.92;text-wrap:pretty}
/* The whole width of the screen shows, so its words can be read; only the bottom runs off the card.
   The hairline keeps a dark phone visible on a dark brand color. */
.phone{align-self:end;width:100%;max-height:100%;overflow:hidden;border-radius:6vw 6vw 0 0;background:#0d0d0f;padding:1.5vw 1.5vw 0;box-shadow:0 3vw 8vw rgba(0,0,0,.28);outline:1px solid rgba(255,255,255,.16)}
.phone img{display:block;width:100%;border-radius:4.6vw 4.6vw 0 0}
</style></head>
<body><div class="card">
  <div class="words">
    <p class="name">{{CLIENT}}</p>
    <p class="step">{{WHAT THIS IS, e.g. ON THEIR PHONE}}</p>
    <h1>{{THE FEATURE, as what it does for the owner}}</h1>
    <p class="sub">{{ONE LINE of plain fact about it}}</p>
  </div>
  <div class="phone"><img src="phone.png" alt=""></div>
</div></body></html>
