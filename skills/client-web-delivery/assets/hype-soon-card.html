<!doctype html>
<!--
  Hype set: COMING-SOON CARD (references/hype-set.md). The phone is the one thing to look at.
  Copy to deliverables/hype/src/soon.html and replace every {{...}}.
  phone.png: a real phone screenshot of the live pitch (scripts/shots.py --phone "/=phone"). Never a generated screen.
  Colors: the client's brand. --ink must read on --paper at 4.5:1 or better.
  Render: python scripts/render_cards.py deliverables/hype deliverables/hype/src/soon.html
-->
<html lang="en"><head><meta charset="utf-8">
<title>{{CLIENT}} coming soon</title>
<style>
@font-face{font-family:Brand;src:url({{FONT_FILE}}) format("truetype");font-weight:200 800}
:root{--paper:#f4f6f8;--ink:#121a2b;--muted:#4c5564;--brand:#1e4872}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Brand,system-ui,sans-serif}
.card{position:relative;width:100vw;height:100vh;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:7.4vw 7.4vw 0;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;font-size:2.6vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
header img{height:5.6vw;width:auto}
.label{color:var(--brand)}
h1{font-size:9.4vw;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-top:6vw;text-wrap:balance;max-width:12ch}
.sub{font-size:3.9vw;line-height:1.32;color:var(--muted);margin-top:2.6vw;max-width:26ch;text-wrap:pretty}
.where{align-self:flex-start;margin-top:3vw;font-size:2.3vw;font-weight:700;background:var(--ink);color:var(--paper);padding:1.3vw 2.2vw;border-radius:1vw}
/* The phone runs off the bottom edge at both sizes: on the taller story it grows with the space (50cqh)
   instead of stopping short with a flat end in the middle of the card. */
.phone{flex:1;min-height:0;margin-top:5vw;display:flex;justify-content:center;align-items:flex-start;container-type:size}
.phone div{width:max(52vw,50cqh);border-radius:7vw 7vw 0 0;background:#0d0d0f;padding:1.7vw 1.7vw 0;box-shadow:0 3vw 8vw rgba(0,0,0,.22)}
.phone img{display:block;width:100%;border-radius:5.4vw 5.4vw 0 0}
</style></head>
<body><div class="card">
  <header><span>{{CLIENT}}</span><span class="label">{{LABEL, e.g. NEW WEBSITE}}</span></header>
  <h1>{{HEADLINE: the site is built or on its way, in one short line}}</h1>
  <p class="sub">{{ONE LINE: what is on it, in the owner's terms}}</p>
  <!-- The pitch address while it is a pitch; the real domain once they buy. Remove the line to leave it off. -->
  <p class="where">{{ADDRESS}}</p>
  <div class="phone"><div><img src="phone.png" alt=""></div></div>
</div></body></html>
