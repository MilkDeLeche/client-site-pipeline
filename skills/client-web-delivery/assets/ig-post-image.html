<!doctype html>
<!--
  Instagram mockups (references/mockups.md): THE POST IMAGE. The logo, one owner-picked line, and the news.
  It is a real post the client can put on their page, and the picture inside the post and profile mockups.
  Copy to deliverables/instagram/src/post-image.html and replace every {{...}}.
  logo.svg or logo.png: the client's real logo file. Colors from brand-kit.md or the brand board.
  --ink on --paper must read at 4.5:1 or better.
  Render: python scripts/render_cards.py deliverables/instagram deliverables/instagram/src/post-image.html
-->
<html lang="en"><head><meta charset="utf-8">
<title>{{CLIENT}} post image</title>
<style>
@font-face{font-family:Brand;src:url({{FONT_FILE}}) format("truetype");font-weight:200 800}
:root{--paper:#f3f2ef;--ink:#121212;--accent:#1e4872;--muted:#4c4c4c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Brand,system-ui,sans-serif}
.card{width:100vw;height:100vh;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:9vw}
/* The logo is the subject: it sits large and alone in the middle third. */
.logo{flex:1;display:flex;align-items:center;justify-content:center}
.logo img{width:78vw;height:auto;max-height:30vh;object-fit:contain}
.top{font-size:2.6vw;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.line{font-size:7.6vw;line-height:1.04;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.foot{font-size:3vw;line-height:1.35;color:var(--muted);margin-top:2.4vw}
</style></head>
<body><div class="card">
  <p class="top">{{THE NEWS, e.g. NEW WEBSITE}}</p>
  <div class="logo"><img src="logo.svg" alt="{{CLIENT}}"></div>
  <div><p class="line">{{ONE OWNER-PICKED LINE}}</p><p class="foot">{{ONE PLAIN LINE, e.g. Link in bio.}}</p></div>
</div></body></html>
