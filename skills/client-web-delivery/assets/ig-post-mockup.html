<!doctype html>
<!--
  Instagram mockups (references/mockups.md): THE POST, AS IT LOOKS IN THE FEED. Drawn in code, so the picture always fits.
  A generic feed layout: no platform logo, no like or follower counts (a number nobody measured is a fabricated claim).
  Copy to deliverables/instagram/src/post-mockup.html and replace every {{...}}.
  avatar.png: the logo mark, square. post.png: the post image (ig-post-image.html rendered) or a real photo or site screenshot.
  Render: python scripts/render_cards.py deliverables/instagram deliverables/instagram/src/post-mockup.html
-->
<html lang="en"><head><meta charset="utf-8">
<title>{{CLIENT}} post mockup</title>
<style>
@font-face{font-family:Brand;src:url({{FONT_FILE}}) format("truetype");font-weight:200 800}
:root{--bg:#121212;--avatar-bg:#121212}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.card{width:100vw;height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center}
/* The post sits like a phone screen held up: white card, soft drop shadow for one level of elevation. */
.post{width:72vw;background:#fff;color:#111;border-radius:2.4vw;overflow:hidden;box-shadow:0 3vw 8vw rgba(0,0,0,.35)}
.head{display:flex;align-items:center;gap:2vw;padding:2.2vw 2.6vw}
.avatar{width:6.4vw;height:6.4vw;border-radius:50%;background:var(--avatar-bg) center/70% no-repeat;outline:.35vw solid #fff;box-shadow:0 0 0 .55vw #d8d8d8;flex-shrink:0}
.who b{display:block;font-size:2.3vw;font-weight:700}
.who span{display:block;font-size:1.9vw;color:#555}
.dots{margin-left:auto;width:4vw;height:1vw}
.pic{width:100%;aspect-ratio:4/5;background:#ddd center/cover no-repeat}
.actions{display:flex;align-items:center;gap:2.6vw;padding:2.2vw 2.6vw 1.2vw}
.actions svg{width:4.4vw;height:4.4vw;fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.actions .save{margin-left:auto}
.caption{font-size:2.2vw;line-height:1.4;padding:0 2.6vw 2.8vw}
.caption b{font-weight:700;margin-right:.8vw}
</style></head>
<body><div class="card">
  <article class="post">
    <div class="head">
      <div class="avatar" style="background-image:url(avatar.png)"></div>
      <div class="who"><b>{{HANDLE}}</b><span>{{PLACE}}</span></div>
      <svg class="dots" viewBox="0 0 40 10" aria-hidden="true"><circle cx="5" cy="5" r="3.2" fill="#111"/><circle cx="20" cy="5" r="3.2" fill="#111"/><circle cx="35" cy="5" r="3.2" fill="#111"/></svg>
    </div>
    <div class="pic" style="background-image:url(post.png)"></div>
    <div class="actions" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.5 1.1 4.8 2.9 1.3-1.8 2.8-2.9 4.8-2.9 3.3 0 5.6 3.1 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.1-4.2A8.5 8.5 0 1 1 20.5 12z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M21.5 3.5 10.6 13.3M21.5 3.5l-6.7 17-4.2-7.2-7.1-4.1 18-5.7z"/></svg>
      <svg class="save" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.6-6 4.6z"/></svg>
    </div>
    <p class="caption"><b>{{HANDLE}}</b>{{CAPTION: one or two lines, researched, in the owner's voice}}</p>
  </article>
</div></body></html>
