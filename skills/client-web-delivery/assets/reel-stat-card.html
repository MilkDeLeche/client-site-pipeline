<!doctype html>
<!--
  Launch reel: ANIMATED STAT CARD (references/launch-reel.md). The stat card, moving: the hook comes in, the number
  counts up to its real value, then what it means and where it comes from. Written in code, so every word stays sharp.
  Copy to deliverables/hype/src/reel-stat.html and replace every {{...}}. Same colors and rules as hype-stat-card.html:
  the number is exactly what the source says, and the source is on the card.
  Set data-to (the number), data-suffix (% or nothing) on .num.
  Film it:  python scripts/reel.py record deliverables/hype/src/reel-stat.html deliverables/hype/reel-stat.mp4 --size 1080x1920 --seconds 6
  People who turn motion off see the finished card with no movement.
-->
<html lang="en"><head><meta charset="utf-8">
<title>{{CLIENT}} stat, animated</title>
<style>
@font-face{font-family:Brand;src:url({{FONT_FILE}}) format("truetype");font-weight:200 800}
:root{--brand:#1e4872;--on-brand:#ffffff;--accent:#ffd166;--bg:none;--wash:.82}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Brand,system-ui,sans-serif}
.card{position:relative;width:100vw;height:100vh;background:var(--brand) var(--bg) center/cover no-repeat;color:var(--on-brand);display:flex;flex-direction:column;padding:7.4vw}
.card::before{content:"";position:absolute;inset:0;background:var(--brand);opacity:var(--wash)}
.card>*{position:relative}
header{font-size:2.6vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.hook{font-size:7.2vw;line-height:1.08;font-weight:700;letter-spacing:-.02em;text-wrap:balance;max-width:16ch}
.num{display:block;font-size:30vw;line-height:.92;font-weight:800;letter-spacing:-.045em;color:var(--accent);margin-top:4.4vw;font-variant-numeric:tabular-nums}
.means{font-size:3.9vw;line-height:1.32;margin-top:3vw;max-width:25ch;text-wrap:pretty}
footer{font-size:2.05vw;line-height:1.35;max-width:60ch}
/* One movement, used four times in order: each line rises into place as the eye gets to it. */
.in{opacity:0;transform:translateY(3vw);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.hook.in{animation-delay:.3s}.num.in{animation-delay:1.1s}.means.in{animation-delay:2.9s}footer.in{animation-delay:3.6s}
@keyframes rise{to{opacity:1;transform:none}}
footer.in{animation-name:rise-soft}
@keyframes rise-soft{to{opacity:.86;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}footer.in{opacity:.86}}
</style></head>
<body><div class="card">
  <header><span>{{CLIENT}}</span></header>
  <main>
    <p class="hook in">{{HOOK, from hype-language.md}}</p>
    <strong class="num in" data-to="{{NUMBER, digits only}}" data-suffix="%">0%</strong>
    <p class="means in">{{WHAT THE NUMBER COUNTS, exactly as the source says it}}</p>
  </main>
  <footer class="in">{{SOURCE, YEAR (SAMPLE)}}</footer>
</div>
<script>
// Count up to the real number and stop on it exactly. With motion turned off, show it at once.
const num = document.querySelector(".num");
const to = Number(num.dataset.to), suffix = num.dataset.suffix || "";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const begin = performance.now() + 1100, length = 1500;
function tick(now) {
  const t = still ? 1 : Math.min(1, Math.max(0, (now - begin) / length));
  num.textContent = Math.round(to * (1 - Math.pow(1 - t, 3))) + suffix;
  if (t < 1) requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body></html>
